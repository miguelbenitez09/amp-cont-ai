apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amp-portops-hpa
  namespace: amp-portops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amp-portops-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
