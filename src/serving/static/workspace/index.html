<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de instancia · PortOps-AI</title><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/workspace/workspace.css"><script defer src="/static/js/browser_security.js"></script><script defer src="/static/workspace/workspace.js"></script></head>
<body class="management-app theme-cyber-ocean"><a class="skip" href="#workspace-main">Saltar al contenido</a>
