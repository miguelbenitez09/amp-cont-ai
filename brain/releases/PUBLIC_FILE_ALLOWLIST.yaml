{
  "version": 2,
  "max_file_bytes": 2000000,
  "include": [
    "LICENSE",
    "README.md",
    "requirements-framework.txt",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
    ".env.example",
    "setup_platform.ps1",
    "setup_platform.bat",
    "setup_platform.sh",
    "src/framework/**/*.py",
    "src/framework/**/*.sql",
    "src/serving/static/framework/*",
    "src/serving/static/landing.html",
    "scripts/install.py",
    "scripts/build_public_release.py",
    "scripts/verify_public_release.py",
    "scripts/validation/*",
    "brain/releases/PUBLIC_FILE_ALLOWLIST.yaml",
    "docs/INSTALLATION.md",
    "docs/CONFIGURATION.md",
    "docs/OPERATIONS.md"
  ],
  "required": [
    "requirements-framework.txt",
    "src/framework/app.py",
    "Dockerfile",
    "scripts/install.py"
  ]
}
