# Panama PortOps-AI v2.0 - Granular Permission Catalog & Role Mappings
# Desarrollado v1.0 Miguel Benítez - GNU GPL-3.0
permissions:
  # Identity & Users
  - id: "user.read"
    resource: "user"
    action: "read"
    description: "Consultar lista y perfiles de usuarios"
  - id: "user.create"
    resource: "user"
    action: "create"
    description: "Crear nuevos usuarios en el sistema"
  - id: "user.disable"
    resource: "user"
    action: "disable"
    description: "Desactivar o suspender cuentas de usuario"
  - id: "role.read"
    resource: "role"
    action: "read"
    description: "Ver catálogo de roles y permisos asignados"
  - id: "role.assign"
    resource: "role"
    action: "assign"
    description: "Asignar roles a usuarios"

  # Data Platform
  - id: "data.source.read"
    resource: "data.source"
    action: "read"
    description: "Ver fuentes de datos y metadatos de extracción"
  - id: "data.source.create"
    resource: "data.source"
    action: "create"
    description: "Registrar nuevas fuentes de datos"
  - id: "data.ingest.execute"
    resource: "data.ingest"
    action: "execute"
    description: "Disparar pipelines de ingesta Raw y Bronze"
  - id: "data.dataset.read"
    resource: "data.dataset"
    action: "read"
    description: "Consultar datasets en capas Bronze, Silver y Gold"
  - id: "data.dataset.export"
    resource: "data.dataset"
    action: "export"
    description: "Exportar datasets con auditoría de descarga"
  - id: "data.dataset.delete"
    resource: "data.dataset"
    action: "delete"
    description: "Eliminar datasets o mover a cuarentena"

  # Feature Store
  - id: "feature.read"
    resource: "feature"
    action: "read"
    description: "Consultar definiciones y valores de características"
  - id: "feature.create"
    resource: "feature"
    action: "create"
    description: "Registrar nuevas definiciones de features con cutoff"
  - id: "feature.publish"
    resource: "feature"
    action: "publish"
    description: "Publicar features al catálogo Gold oficial"

  # Experiments & Models
  - id: "experiment.create"
    resource: "experiment"
    action: "create"
    description: "Iniciar nuevo experimento de entrenamiento"
  - id: "experiment.execute"
    resource: "experiment"
    action: "execute"
    description: "Ejecutar backtesting temporal expanding window"
  - id: "experiment.read"
    resource: "experiment"
    action: "read"
    description: "Consultar resultados y métricas de experimentos"
  - id: "model.train"
    resource: "model"
    action: "train"
    description: "Entrenar modelos en el Model Registry"
  - id: "model.register"
    resource: "model"
    action: "register"
    description: "Registrar versión de modelo con hash de dataset"
  - id: "model.review"
    resource: "model"
    action: "review"
    description: "Evaluar y dictaminar modelo para promoción"
  - id: "model.promote"
    resource: "model"
    action: "promote"
    description: "Promover modelo a Champion de producción (requiere aprobación)"
  - id: "model.rollback"
    resource: "model"
    action: "rollback"
    description: "Revertir modelo de producción a versión previa"

  # Inference & Simulation
  - id: "forecast.read"
    resource: "forecast"
    action: "read"
    description: "Ejecutar inferencia predictiva y consultar cuantiles"
  - id: "simulation.run"
    resource: "simulation"
    action: "run"
    description: "Ejecutar simulaciones Monte Carlo y stress testing"
  - id: "simulation.export"
    resource: "simulation"
    action: "export"
    description: "Exportar reportes de resiliencia estocástica"

  # Audit & WORM
  - id: "audit.read"
    resource: "audit"
    action: "read"
    description: "Consultar logs y eventos de seguridad"
  - id: "audit.verify"
    resource: "audit"
    action: "verify"
    description: "Verificar integridad criptográfica de la cadena WORM"

  # System & Configuration
  - id: "system.config.read"
    resource: "system.config"
    action: "read"
    description: "Consultar configuración del sistema"
  - id: "system.config.write"
    resource: "system.config"
    action: "write"
    description: "Modificar parámetros de configuración dinámica"
  - id: "secret.read"
    resource: "secret"
    action: "read"
    description: "Consultar inventario de secretos y estado de rotación"
  - id: "secret.rotate"
    resource: "secret"
    action: "rotate"
    description: "Ejecutar rotación de llaves y secretos de cifrado"

# Asignación de Permisos por Rol
role_permission_mappings:
  root:
    - "*"
  platform_admin:
    - "user.*"
    - "role.read"
    - "data.source.*"
    - "data.dataset.read"
    - "data.dataset.export"
    - "feature.read"
    - "experiment.read"
    - "model.register"
    - "forecast.read"
    - "simulation.*"
    - "audit.read"
    - "audit.verify"
    - "system.config.*"
    - "secret.read"
  security_admin:
    - "user.read"
    - "user.disable"
    - "role.*"
    - "audit.*"
    - "secret.*"
    - "system.config.read"
  data_engineer:
    - "data.*"
    - "feature.*"
    - "audit.read"
    - "forecast.read"
  data_steward:
    - "data.source.read"
    - "data.dataset.read"
    - "data.dataset.export"
    - "feature.read"
    - "audit.read"
  mlops_engineer:
    - "data.dataset.read"
    - "feature.read"
    - "experiment.*"
    - "model.train"
    - "model.register"
    - "forecast.read"
    - "simulation.run"
    - "audit.read"
  ml_reviewer:
    - "experiment.read"
    - "model.review"
    - "model.promote"
    - "model.rollback"
    - "data.dataset.read"
    - "audit.read"
    - "audit.verify"
  port_operator:
    - "forecast.read"
    - "simulation.run"
    - "data.dataset.read"
    - "audit.read"
  simulation_analyst:
    - "simulation.*"
    - "forecast.read"
    - "data.dataset.read"
    - "audit.read"
  compliance_auditor:
    - "audit.*"
    - "data.dataset.read"
    - "model.review"
    - "system.config.read"
  api_consumer:
    - "forecast.read"
  readonly_viewer:
    - "data.source.read"
    - "audit.verify"
