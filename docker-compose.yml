# Docker Compose for Panama PortOps-AI Enterprise MLOps Stack v1.0
# Author: Desarrollado v1.0 Miguel Benítez
# License: GNU GPL-3.0 with Section 7 Mandatory Attribution
# Profiles supported: core, ml, rag, mcp, security, observability, full

services:
  # ============================================================================
  # 1. CORE PROFILE: Serving API, TimescaleDB, and Redis In-Memory Cache
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portops-api
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MODEL_NAME=Panama_PortOps_LightGBM
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:panama_portops_pass@timescaledb:5432/amp_portops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTHOR=Desarrollado v1.0 Miguel Benítez
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.serving.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2.5-alpine
    container_name: portops-redis
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: portops-timescaledb
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=panama_portops_pass
      - POSTGRES_DB=amp_portops
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2. ML PROFILE: vLLM High-Throughput OpenAI-Compatible Inference Server
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: portops-vllm
    restart: unless-stopped
    profiles: ["ml", "full"]
    ports:
      - "8001:8000"
    environment:
      - MODEL=google/gemma-2-9b-it
      - GPU_MEMORY_UTILIZATION=0.88
      - MAX_MODEL_LEN=4096
      - TENSOR_PARALLEL_SIZE=1
    volumes:
      - ./models/llm_weights:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--model", "google/gemma-2-9b-it", "--host", "0.0.0.0", "--port", "8000", "--trust-remote-code"]

  # ============================================================================
  # 3. RAG PROFILE: MinIO S3-Compatible Object Store & Vector Lakehouse
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: portops-minio
    restart: unless-stopped
    profiles: ["rag", "full"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=portops_minio_admin
      - MINIO_ROOT_PASSWORD=portops_minio_secret_key_2026
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 4. MCP PROFILE: Model Context Protocol (MCP) Server for AI Agents
  # ============================================================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portops-mcp
    restart: unless-stopped
    profiles: ["mcp", "full"]
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=production
      - AUTHOR=Desarrollado v1.0 Miguel Benítez
    command: ["python", "-m", "src.mcp.server"]

  # ============================================================================
  # 5. OBSERVABILITY PROFILE: Prometheus & Grafana Metric Dashboards
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: portops-prometheus
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: portops-grafana
    restart: unless-stopped
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=portops_grafana_pass
    volumes:
      - grafana_data:/var/lib/grafana

  # ============================================================================
  # 6. SECURITY PROFILE: Wazuh Zero-Trust SIEM & File Integrity Monitoring
  # ============================================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: portops-wazuh-manager
    restart: unless-stopped
    profiles: ["security", "full"]
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - wazuh_manager_data:/var/ossec/data

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: portops-wazuh-indexer
    restart: unless-stopped
    profiles: ["security", "full"]
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: portops-wazuh-dashboard
    restart: unless-stopped
    profiles: ["security", "full"]
    ports:
      - "8443:5601"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
    depends_on:
      - wazuh-indexer

  # ============================================================================
  # 7. DASHBOARD: Streamlit Executive Visualizer
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portops-dashboard
    restart: unless-stopped
    profiles: ["core", "full"]
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
      - ./data/gold:/app/data/gold:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "apps/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  timescale_data:
  minio_data:
  prometheus_data:
  grafana_data:
  wazuh_manager_data:
  wazuh_indexer_data:

networks:
  default:
    name: portops-mlops-network
