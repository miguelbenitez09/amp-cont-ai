name: Framework isolated verification
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AMP_STATE_DIR: ${{ runner.temp }}/amp-framework-ci
      AMP_MODE: portal
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical runtime and test tools
        run: python -m pip install -r requirements-framework.txt pytest==8.3.5 httpx==0.28.1
      - name: Isolated framework tests only
        run: python -m pytest -q tests/test_public_release_boundary.py tests/test_framework_installer.py tests/test_framework_ml.py
      - name: Build public candidate
        run: python scripts/build_public_release.py --output ${{ runner.temp }}/amp-public.zip
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose and build clean image
        run: |
          docker compose config --quiet
          docker build --tag amp-framework:ci .
      - name: Container health
        run: |
          docker run --detach --name amp-ci -p 127.0.0.1:18000:8000 amp-framework:ci
          python -c "import urllib.request,time; exec('for attempt in range(30):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:18000/health\",timeout=2); break\n except Exception:\n  time.sleep(1)\nelse:\n raise SystemExit(\"Container failed health check\")')"
      - name: Diagnostics
        if: failure()
        run: docker logs amp-ci
      - name: Cleanup CI container
        if: always()
        run: docker rm -f amp-ci
