name: Public candidate gate
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  public-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q tests/test_public_release_boundary.py
      - name: Assemble reviewed allowlist
        run: python scripts/build_public_release.py --output ${{ runner.temp }}/amp-public.zip
      - name: Verify extracted installation imports without legacy checkout
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/public-candidate"
          python -m zipfile -e "${{ runner.temp }}/amp-public.zip" "${{ runner.temp }}/public-candidate"
          cd "${{ runner.temp }}/public-candidate"
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-framework.txt
          AMP_STATE_DIR="${{ runner.temp }}/release-state" .venv/bin/python -c "from src.framework.app import app; assert app"
      # No upload: source history and data/model releases require separate review.
