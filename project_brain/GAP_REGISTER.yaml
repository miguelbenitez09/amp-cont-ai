# AMP-CONT-AI GAP REGISTER
# Registro Oficial de Brechas, Severidad, Estado y Evidencia de Mitigación
# Metodología: LOOP Engineering (Locate -> Observe -> Operate -> Prove -> Reconcile)

gaps:
  - id: "UI-001"
    title: "Paso 1 bloqueado o rechazado pero pasos subsiguientes continúan en 'Ejecutando...'"
    severity: "CRITICAL"
    category: "FRONTEND_STATE_MACHINE"
    status: "RESOLVED"
    description: "Cuando la validación de entrada o el guardrail rechaza una consulta, la UI mantenía indicadores de carga en pasos 2-5 en lugar de pasar deterministamente a OMITTED o CANCELLED."
    corrective_action: "Implementada máquina de estados finitos determinista en v1_router.py y app.js con estado OMITTED en pasos 2-5."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "UI-002"
    title: "Inconsistencia de Sello Criptográfico entre tarjeta de Agente ('Sello Válido') y Header ('Sello No Verificado')"
    severity: "CRITICAL"
    category: "CRYPTO_UX"
    status: "RESOLVED"
    description: "El header y el widget del agente tenían lecturas desacopladas del estado criptográfico de la respuesta."
    corrective_action: "Unificada una sola fuente de verdad criptográfica reactiva sincronizada con cryptographic_seal en la respuesta del backend."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "UI-003"
    title: "Etiqueta técnica 'Chain of Thought' mostrada al usuario en lugar de traza auditable"
    severity: "HIGH"
    category: "UX_TRANSPARENCY"
    status: "RESOLVED"
    description: "Mostrar 'Chain of Thought' insinúa razonamiento privado no verificable y no cumple estándares de auditoría soberana."
    corrective_action: "Reemplazado por 'Traza de Ejecución, Evidencia y Decisiones (Auditoría Soberana)' en index.html y v1_router.py."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "UI-004"
    title: "Guardrail bloquea consulta sin proveer ayuda contextual o ejemplos válidos"
    severity: "MEDIUM"
    category: "UX_GUIDANCE"
    status: "RESOLVED"
    description: "Cuando el guardrail bloquea una solicitud, la respuesta es seca y no instruye al usuario sobre qué consultas logísticas/arancelarias sí admite el sistema."
    corrective_action: "Añadido objeto contextual_help con admissible_domains y recommended_queries en respuestas bloqueadas."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "UI-005"
    title: "Falta de contexto permanente de Sesión, Rol y Capacidades vigentes en el encabezado"
    severity: "HIGH"
    category: "RBAC_VISIBILITY"
    status: "IN_PROGRESS"
    description: "El usuario no tenía visibilidad permanente de qué rol y permisos activos tiene en su sesión actual."
    corrective_action: "Implementar HUD permanente en el Header mostrando usuario, rol, tier de capabilities y botón de inspección de matriz."
    verification_test: "tests/test_ui_role_hud.py"

  - id: "UI-006"
    title: "Panel mezcla estados técnicos, razonamiento, RAG e inferencia en una sola superficie confusa"
    severity: "MEDIUM"
    category: "UI_ERGONOMICS"
    status: "IN_PROGRESS"
    description: "La presentación visual amontonaba resultados cuantitativos, aranceles, trazas y métricas técnicas."
    corrective_action: "Separar limpiamente la vista en 3 pestañas o secciones claras: 1. Resultado Directo y Cuantiles, 2. Evidencia Oficial & Arancel ANA, 3. Traza Criptográfica de Auditoría."
    verification_test: "tests/test_ui_layout_separation.py"

  - id: "UI-007"
    title: "Ausencia de identificador visible (trace_id / request_id) para localizar ejecuciones en auditoría WORM"
    severity: "HIGH"
    category: "AUDIT_TRACELINK"
    status: "RESOLVED"
    description: "Las respuestas de inferencia no mostraban un botón rápido para copiar el trace_id o verificarlo directamente en el registro WORM."
    corrective_action: "Inclusión de trace_id estructurado 'req_*' tanto en respuestas bloqueadas como exitosas."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "UI-008"
    title: "Botón de ejecución habilitado en estados transitorios o inconsistentes"
    severity: "HIGH"
    category: "FRONTEND_INTERACTION"
    status: "RESOLVED"
    description: "Se podía presionar 'Enviar / Consultar' múltiples veces durante una inferencia en curso, creando race conditions."
    corrective_action: "Bloqueo estricto del botón btnRun mediante atributo disabled en bloques try/finally."
    verification_test: "tests/test_ui_state_machine.py"

  - id: "ARCH-001"
    title: "Persistencia operacional exclusivamente en SQLite sin soporte nativo PostgreSQL + pgvector"
    severity: "HIGH"
    category: "ARCHITECTURE_STORAGE"
    status: "IN_PROGRESS"
    description: "El sistema productivo requiere soporte para PostgreSQL 16 con esquemas desacoplados y pgvector sin romper la compatibilidad SQLite existente."
    corrective_action: "Implementar capa de acceso dual src/infrastructure/database/ con esquemas iam, audit, ai, rag, ml, brain, ops, customs, catalog, system."
    verification_test: "tests/test_database_dual_engine.py"

  - id: "BRAIN-001"
    title: "Ausencia de Project Brain consultable via API para estado, capacidades y gobernanza de código"
    severity: "HIGH"
    category: "SYSTEM_GOVERNANCE"
    status: "RESOLVED"
    description: "El estado de las capacidades del sistema y las decisiones arquitectónicas no eran consultables programáticamente."
    corrective_action: "Creado src/brain/service.py y endpoints /api/v1/brain/* alimentados por los manifiestos de project_brain/."
    verification_test: "tests/test_brain_api.py"
